services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    ports:
      - '3552:3552'
    networks:
      - caddy_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $BASEPATH:$BASEPATH
      - $BASEPATH/arcane/data:/app/data
      - $BASEPATH/arcane/data/backups:/backups
    environment:
      - APP_URL=http://172.27.42.5:3552
      - ENCRYPTION_KEY=$JWT_KEY
      - JWT_SECRET=$JWT_SECRET
      - PROJECTS_DIRECTORY=$BASEPATH
      - PUID=1000
      - PGID=1000
      - ANALYTICS_DISABLED=true
      - DISK_USAGE_PATH=$BASEPATH
    restart: unless-stopped

networks:
  caddy_net:
    external: true
